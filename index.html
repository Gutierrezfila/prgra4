<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcial 1 - Gestión de Libros</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/bootstrap.min.css" />
    <style>
        /* Un toque extra de azul al fondo general */
        body {
            background-color: #f0f5ff !important;
        }

        .navbar {
            shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }
    </style>
</head>

<body>
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#">
                    📚 BIBLIOTECA UGB
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link px-3" :class="{ 'active fw-bold': forms.autor.mostrar }"
                                @click="abrirFormulario('autor')" href="#">Autores</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link px-3" :class="{ 'active fw-bold': forms.libro.mostrar }"
                                @click="abrirFormulario('libro')" href="#">Libros</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-4">
            <div id="appSistema" class="p-4 bg-white rounded-3 border border-primary-subtle shadow">

                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold text-primary">Gestión de Libros</h1>
                    <hr class="mx-auto border-primary opacity-25" style="width: 200px;">
                </div>

                <autor v-show="forms.autor.mostrar" :forms="forms" ref="autor"
                    @buscar="buscar('buscarautor', 'listarAutores')"></autor>
                <buscarautor v-show="forms.buscarAutor.mostrar" ref="buscarautor"
                    @modificar="modificar('autor', 'modificarAutor', $event)"></buscarautor>

                <libro v-show="forms.libro.mostrar" :forms="forms" ref="libro"
                    @buscar="buscar('buscarlibro', 'listarLibros')"></libro>
                <buscarlibro v-show="forms.buscarLibro.mostrar" ref="buscarlibro"
                    @modificar="modificar('libro', 'modificarLibro', $event)"></buscarlibro>
            </div>
        </div>
    </div>

    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script src="componentes/busqueda_autores.js"></script>
    <script src="componentes/autores.js"></script>
    <script src="componentes/busqueda_libros.js"></script>
    <script src="componentes/libros.js"></script>

    <script src="main.js"></script>
</body>

</html>
